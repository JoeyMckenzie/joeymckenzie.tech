name: ci

# This branch, not `main`: `main` is the Laravel app and carries its own
# `ci.yml` deploying to Laravel Cloud. Promoting the Next rewrite means
# changing these three branch references and reconciling with that file.
on:
    push:
        branches:
            - poc/nextjs-again
    pull_request:
        branches:
            - poc/nextjs-again

permissions:
    contents: read

# Every job does the same devenv setup and then calls one script from
# `devenv.nix`. The pipeline itself lives there so it runs the same way locally.
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: |
                      experimental-features = nix-command flakes

            - name: Set up devenv cache
              uses: cachix/cachix-action@v16
              with:
                  name: devenv

            - name: Install devenv
              run: nix profile install nixpkgs#devenv

            - name: Lint, format, and typecheck
              run: devenv shell ci-lint

    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: |
                      experimental-features = nix-command flakes

            - name: Set up devenv cache
              uses: cachix/cachix-action@v16
              with:
                  name: devenv

            - name: Install devenv
              run: nix profile install nixpkgs#devenv

            - name: Build static export
              run: devenv shell ci-build

    deploy:
        needs: [lint, build]
        if: github.event_name == 'push' && github.ref == 'refs/heads/poc/nextjs-again'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: |
                      experimental-features = nix-command flakes

            - name: Set up devenv cache
              uses: cachix/cachix-action@v16
              with:
                  name: devenv

            - name: Install devenv
              run: nix profile install nixpkgs#devenv

            # Wrangler reads both of these from the environment. The Pages project
            # (`website`) has to exist before the first run -- wrangler will not
            # create it on deploy.
            - name: Deploy to Cloudflare Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: devenv shell ci-deploy
